task: qimma_mizan
dataset_path: qimma/MCQ_MizanQA
dataset_name: default
output_type: generate_until
training_split: null
validation_split: null
test_split: test
fewshot_split: null
num_fewshot: 0
doc_to_text: !function utils.doc_to_text
doc_to_target: !function utils.doc_to_target
process_results: !function utils.process_results
generation_kwargs:
  until: []
  do_sample: false
  temperature: 0.0
  max_gen_toks: 8192
filter_list:
  - name: answer
    filter:
      - function: qimma_mizan_answer
      - function: take_first
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: set_precision
    aggregation: mean
    higher_is_better: true
  - metric: set_recall
    aggregation: mean
    higher_is_better: true
  - metric: set_f1
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
